name: Build, test, and propose deploy

on:
  push:
    branches: [main]

env:
  IMAGE_REPOSITORY: gitea.internal:3000/overseer-bot/sell-my-stuff
  OVERSEER_BASE_URL: https://overseer.26fe.uk

jobs:
  build-test-propose:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable patch tag, not the floating v4 major tag.
      # The Gitea Actions runner's cached clone of v4 is corrupted
      # ("Unable to pull refs/heads/v4: non-fast-forward update"),
      # confirmed live on this same runner while debugging sell-browser
      # (2026-09-06) -- every job referencing @v4 fails at this step,
      # before reaching any project code. v4.2.2 is a specific release
      # tag, never force-moved once published, so it caches under a
      # distinct key unaffected by the broken v4 entry.
      - uses: actions/checkout@v4.2.2

      - name: Build and run quality gates
        run: docker build -t "$IMAGE_REPOSITORY:${{ gitea.sha }}" .

      - name: Push image
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea.internal:3000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker push "$IMAGE_REPOSITORY:${{ gitea.sha }}"

      # Calls Overseer's live POST /deploy endpoint directly, over the
      # stable OVERSEER_BASE_URL hostname -- NOT the disposable local
      # `overseer-core` container + local Docker volumes this step used
      # to run against. That older approach genuinely succeeded at
      # *a* propose-deploy call every time, which is exactly what made
      # it so easy to miss: the disposable container has its own
      # throwaway data store, structurally unable to reach the same
      # store the live dashboard/MCP reads from, so no proposal from
      # this workflow was ever actually visible anywhere real. Fixed
      # for sell-browser earlier (2026-09-06); this repo's workflow
      # just hadn't been updated to match yet.
      - name: Propose deploy through Overseer (propose-only; never approves or executes)
        run: |
          curl -sf -X POST "$OVERSEER_BASE_URL/deploy" \
            -H "Authorization: Bearer ${{ secrets.OVERSEER_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              const fs = require("fs");
              const manifest = fs.readFileSync("overseer-app.yaml", "utf8");
              console.log(JSON.stringify({
                manifest: Buffer.from(manifest).toString("base64"),
                image: process.env.IMAGE_REPOSITORY + ":" + process.env.GITEA_SHA,
                reason: "CI build " + process.env.GITEA_SHA,
                portainerAdapter: "portainer-ci",
                unifiAdapter: "unifi-ci",
                nginxProxyManagerAdapter: "nginx-proxy-manager-ci",
              }));
            ')"
        env:
          GITEA_SHA: ${{ gitea.sha }}
