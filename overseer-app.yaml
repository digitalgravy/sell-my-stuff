version: 1
project: sell-my-stuff
environment: dev

image:
  repository: gitea.internal:3000/overseer-bot/sell-my-stuff

container:
  port: 3000
  healthCheckPath: /api/healthz
  # Durable photo-upload storage, separate from the container's writable
  # layer -- without this, uploaded photos are lost on every redeploy.
  # Host path must exist and be owned by 1000:1000 (the `node` user the
  # runtime image runs as) before this is deployed -- Docker will
  # otherwise auto-create it as root and every upload will fail with a
  # permission error. Same manifest field/convention as sell-browser's
  # profile volume.
  volumes:
    - hostPath: /srv/sell-my-stuff/uploads
      containerPath: /data/uploads
      readOnly: false
  env:
    APP_ORIGIN: https://sell.26fe.uk
    # Safe to enable now that Postgres is connected (f945117) and the
    # durable upload volume above is provisioned -- previously left
    # false because uploads would otherwise have lived only on the
    # container's ephemeral writable layer.
    CAPTURE_API_ENABLED: 'true'
    SELL_STORAGE_PATH: /data/uploads
    DATABASE_HOST: docker.26fe.uk
    DATABASE_PORT: '5432'
    DATABASE_NAME: sell_my_stuff
    DATABASE_USER: postgres
    DATABASE_PASSWORD: ${secret:DATABASE_PASSWORD}
    # Authenticates the capture bookmarklet's cross-origin POST (it
    # runs injected into whatever page the user is on, so it can't use
    # the same-origin check every other mutating route uses).
    CAPTURE_INBOX_TOKEN: ${secret:CAPTURE_INBOX_TOKEN}
    # Consumed by the inspect_images worker, which now runs inside this
    # same container (see entrypoint.sh) -- without this the worker
    # process crashes on startup and, by design, takes the whole
    # container down with it (see entrypoint.sh's comment).
    ANTHROPIC_API_KEY: ${secret:ANTHROPIC_API_KEY}
    # sell-browser's internal base URL (its own project, LAN-only --
    # see that repo's README). Not a secret: it's an internal hostname,
    # not a credential. Absent this, research_comparable_sales_job just
    # skips straight to the manual search-link fallback -- see that
    # job's own doc comment.
    SELL_BROWSER_BASE_URL: https://sell-browser.26fe.uk
    # sell-browser-mac: the real Chrome on claw.internal (an always-on
    # Mac, not Overseer-managed -- see ~/Documents/Projects/sell-browser-mac
    # on the dev machine for its source). Tried before SELL_BROWSER_BASE_URL
    # above -- see research-comparable-sales-job.ts's cascade doc comment
    # for why. Port 3200 is that service's own default.
    SELL_BROWSER_MAC_BASE_URL: http://claw.internal:3200
    # Origin postcode for the Parcel2Go postage-quote integration
    # (server/postage/parcel2go-client.ts) -- a secret, not a plain env
    # var like the hostnames above, because it's the owner's real home
    # postcode and this repo mirrors to a public GitHub remote.
    HOME_POSTCODE: ${secret:HOME_POSTCODE}

network:
  hostname: sell
  exposeExternally: false

ownership:
  sourceRepo: stue/sell-my-stuff
  backupClass: application
  dataCriticality: medium

deploy:
  autoApproveRedeploy: false
